<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDF9E" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#C5A059" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2C221E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB3"/>
      <stop offset="35%" stop-color="#C5A059"/>
      <stop offset="70%" stop-color="#8F6A24"/>
      <stop offset="100%" stop-color="#DDB96D"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#goldMetal)" stroke-width="3" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="url(#goldMetal)" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="200" r="150" fill="url(#goldGlow)" opacity="0.3"/>
  <!-- Central Kazakh 4-Horn Cross (Төртқұлақ / Қошқар мүйіз композициясы) -->
  <g transform="translate(200, 200)" filter="url(#dropShadow)" fill="url(#goldMetal)" stroke="#584013" stroke-width="1.5">
    <!-- North horn -->
    <path d="M0,0 C-15,-30 -45,-50 -65,-50 C-95,-50 -115,-20 -95,10 C-80,30 -55,15 -55,0 C-55,-15 -75,-25 -80,-10 C-85,0 -70,15 -60,0 C-50,-20 -25,-40 0,-15 Z"/>
    <path d="M0,0 C15,-30 45,-50 65,-50 C95,-50 115,-20 95,10 C80,30 55,15 55,0 C55,-15 75,-25 80,-10 C85,0 70,15 60,0 C50,-20 25,-40 0,-15 Z"/>
    <!-- South horn -->
    <path d="M0,0 C-15,30 -45,50 -65,50 C-95,50 -115,20 -95,-10 C-80,-30 -55,-15 -55,0 C-55,15 -75,25 -80,10 C-85,0 -70,-15 -60,0 C-50,20 -25,40 0,15 Z"/>
    <path d="M0,0 C15,30 45,50 65,50 C95,50 115,20 95,-10 C80,-30 55,-15 55,0 C55,15 75,25 80,10 C85,0 70,-15 60,0 C50,20 25,40 0,15 Z"/>
    <!-- Central Rhombus Diamond -->
    <polygon points="0,-18 18,0 0,18 -18,0" fill="#FFEBB3" stroke="#8F6A24" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#1B4958"/>
    <!-- Cardinal Petals -->
    <circle cx="0" cy="-75" r="4" fill="#FFEBB3"/>
    <circle cx="0" cy="75" r="4" fill="#FFEBB3"/>
    <circle cx="-75" cy="0" r="4" fill="#FFEBB3"/>
    <circle cx="75" cy="0" r="4" fill="#FFEBB3"/>
  </g>
</svg>