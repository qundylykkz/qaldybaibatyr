<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 640" width="100%" height="100%">
  <defs>
    <radialGradient id="leatherGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#441C15"/>
      <stop offset="65%" stop-color="#240D0A"/>
      <stop offset="100%" stop-color="#140604"/>
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1"/>
      <stop offset="35%" stop-color="#E2B755"/>
      <stop offset="70%" stop-color="#8F6A24"/>
      <stop offset="100%" stop-color="#FCE1A0"/>
    </linearGradient>
    <filter id="embossShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Maroon/Bronze Leather Base -->
  <rect width="450" height="640" rx="8" fill="url(#leatherGlow)"/>

  <!-- Leather Texture Subtle Grid -->
  <rect x="10" y="10" width="430" height="620" rx="6" fill="none" stroke="#60281E" stroke-width="1.5" opacity="0.4"/>

  <!-- Ornate Outer Gold Foil Border -->
  <rect x="22" y="22" width="406" height="596" rx="4" fill="none" stroke="url(#goldFoil)" stroke-width="3.5" filter="url(#embossShadow)"/>
  <rect x="30" y="30" width="390" height="580" rx="3" fill="none" stroke="url(#goldFoil)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.9"/>

  <!-- Four Elaborate Kazakh Corner Ornaments (Қошқар мүйіз бұрыштықтары) -->
  <g fill="url(#goldFoil)" filter="url(#embossShadow)">
    <!-- Top-Left -->
    <path d="M30,30 L90,30 C80,45 65,55 65,70 C50,70 40,80 30,90 Z"/>
    <circle cx="50" cy="50" r="4"/>
    <!-- Top-Right -->
    <path d="M420,30 L360,30 C370,45 385,55 385,70 C400,70 410,80 420,90 Z"/>
    <circle cx="400" cy="50" r="4"/>
    <!-- Bottom-Left -->
    <path d="M30,610 L90,610 C80,595 65,585 65,570 C50,570 40,560 30,550 Z"/>
    <circle cx="50" cy="590" r="4"/>
    <!-- Bottom-Right -->
    <path d="M420,610 L360,610 C370,595 385,585 385,570 C400,570 410,560 420,550 Z"/>
    <circle cx="400" cy="590" r="4"/>
  </g>

  <!-- Central Steppe Battle Emblem / Kazakh Ornamental Medallion -->
  <circle cx="225" cy="300" r="110" fill="none" stroke="url(#goldFoil)" stroke-width="2.5" opacity="0.8"/>
  <circle cx="225" cy="300" r="98" fill="none" stroke="url(#goldFoil)" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Crossed Saber & Spear Graphic in Center -->
  <g transform="translate(225, 300)" filter="url(#embossShadow)">
    <!-- Central Kazakh Four-Horn Flower -->
    <path d="M0,-55 C-25,-55 -40,-35 -20,-15 C-5,0 -15,20 -35,20 C-55,20 -55,-5 -35,-25" fill="none" stroke="url(#goldFoil)" stroke-width="3"/>
    <path d="M0,-55 C25,-55 40,-35 20,-15 C5,0 15,20 35,20 C55,20 55,-5 35,-25" fill="none" stroke="url(#goldFoil)" stroke-width="3"/>
    <path d="M0,55 C-25,55 -40,35 -20,15 C-5,0 -15,-20 -35,-20 C-55,-20 -55,5 -35,25" fill="none" stroke="url(#goldFoil)" stroke-width="3"/>
    <path d="M0,55 C25,55 40,35 20,15 C5,0 15,-20 35,-20 C55,-20 55,5 35,25" fill="none" stroke="url(#goldFoil)" stroke-width="3"/>
    <!-- Center Jewel -->
    <circle cx="0" cy="0" r="14" fill="#1B4958" stroke="url(#goldFoil)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#FFEBB3"/>
  </g>

  <!-- Book Header Series Title -->
  <text x="225" y="85" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="4">ТАРИХИ-ҒЫЛЫМИ ШЕЖІРЕ</text>
  <line x1="140" y1="95" x2="310" y2="95" stroke="url(#goldFoil)" stroke-width="1" opacity="0.7"/>

  <!-- Main Cover Title -->
  <g filter="url(#embossShadow)">
    <text x="225" y="145" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="2">ҚАЛДЫБАЙ БАТЫР</text>
    <text x="225" y="180" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-style="italic" fill="#FFE5A3" text-anchor="middle" letter-spacing="1">және дала шайқастары</text>
  </g>

  <!-- Decorative Divider -->
  <path d="M160,205 Q225,215 290,205" stroke="url(#goldFoil)" stroke-width="2" fill="none"/>
  <circle cx="225" cy="210" r="3.5" fill="url(#goldFoil)"/>

  <!-- Book Subtitle / Author Tag at Bottom -->
  <g filter="url(#embossShadow)">
    <text x="225" y="470" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#E2C17D" text-anchor="middle" letter-spacing="2.5">Исатай мен Махамбет көтерілісі</text>
    <text x="225" y="490" font-family="'Montserrat', sans-serif" font-size="10" font-weight="500" fill="#B38E46" text-anchor="middle" letter-spacing="1.5">1836–1838 ЖЫЛДАР</text>
    
    <text x="225" y="555" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="600" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="3">АЛМАТЫ – 2026</text>
  </g>
</svg>