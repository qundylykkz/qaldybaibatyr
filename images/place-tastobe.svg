<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tastobeSky" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#4A2518"/>
      <stop offset="50%" stop-color="#B85D26"/>
      <stop offset="85%" stop-color="#EAA646"/>
      <stop offset="100%" stop-color="#FCE1A0"/>
    </linearGradient>
    <linearGradient id="hillShade" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#735238"/>
      <stop offset="100%" stop-color="#2D1F17"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#tastobeSky)"/>
  <!-- Distant battle smoke & sunset sun -->
  <circle cx="420" cy="180" r="60" fill="#FFE082" opacity="0.8"/>
  <ellipse cx="280" cy="200" rx="140" ry="25" fill="#42251D" opacity="0.35"/>
  <!-- Tastobe Hill (Тастөбе қыраты) -->
  <path d="M0,260 Q180,170 360,200 Q480,220 600,250 L600,400 L0,400 Z" fill="url(#hillShade)"/>
  <path d="M0,290 Q220,240 440,280 L600,270 L600,400 L0,400 Z" fill="#20150F"/>
  <!-- Battle Silhouettes (Spears, horse riders, flags) -->
  <g fill="#1A110D">
    <!-- Horseman silhouette -->
    <path d="M210,195 Q230,175 250,185 Q260,195 240,210 Q220,215 210,195 Z"/>
    <line x1="240" y1="150" x2="230" y2="210" stroke="#1A110D" stroke-width="2.5"/>
    <!-- Battle banners / Найзалар шоғыры -->
    <line x1="180" y1="170" x2="175" y2="230" stroke="#1A110D" stroke-width="2"/>
    <line x1="195" y1="160" x2="190" y2="230" stroke="#1A110D" stroke-width="2"/>
    <line x1="280" y1="175" x2="275" y2="230" stroke="#1A110D" stroke-width="2"/>
    <line x1="310" y1="165" x2="315" y2="230" stroke="#1A110D" stroke-width="2"/>
    <polygon points="195,160 215,165 195,175"/>
  </g>
  <!-- Foreground Stony Steppe Textures -->
  <ellipse cx="120" cy="350" rx="35" ry="12" fill="#5E4330"/>
  <ellipse cx="480" cy="365" rx="45" ry="15" fill="#4B3425"/>
  <!-- Historical Date Badge Overlay -->
  <rect x="25" y="25" width="180" height="34" rx="4" fill="#1C1410" opacity="0.85" stroke="#C5A059" stroke-width="1.5"/>
  <text x="115" y="47" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#FFEBB3" text-anchor="middle">1837 ЖЫЛ, 15 ҚАРАША</text>
</svg>