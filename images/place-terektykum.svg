<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="terektSky" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#364958"/>
      <stop offset="40%" stop-color="#6F8877"/>
      <stop offset="75%" stop-color="#C7B28B"/>
      <stop offset="100%" stop-color="#F2E6CE"/>
    </linearGradient>
    <linearGradient id="sandDunes" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#D9A766"/>
      <stop offset="60%" stop-color="#9C6B38"/>
      <stop offset="100%" stop-color="#4E331B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#terektSky)"/>
  <!-- Poplar Grove (Теректер) & Rolling Sand Dunes (Құм шағылдары) -->
  <path d="M0,240 Q150,190 320,230 Q470,260 600,210 L600,400 L0,400 Z" fill="url(#sandDunes)"/>
  <path d="M0,290 Q220,250 420,300 Q520,310 600,280 L600,400 L0,400 Z" fill="#3D2916"/>
  <!-- Poplar Trees Silhouettes (Теректер) -->
  <g fill="#253529">
    <!-- Tall Poplar 1 -->
    <path d="M120,240 Q105,170 120,130 Q135,170 120,240 Z"/>
    <line x1="120" y1="210" x2="120" y2="250" stroke="#253529" stroke-width="4"/>
    <!-- Tall Poplar 2 -->
    <path d="M140,245 Q125,185 140,145 Q155,185 140,245 Z"/>
    <line x1="140" y1="220" x2="140" y2="255" stroke="#253529" stroke-width="3"/>
    <!-- Poplar 3 -->
    <path d="M100,250 Q88,200 100,165 Q112,200 100,250 Z"/>
    <!-- Group of poplars on right dune -->
    <path d="M470,225 Q460,180 470,150 Q480,180 470,225 Z"/>
    <path d="M490,230 Q480,190 490,160 Q500,190 490,230 Z"/>
  </g>
  <!-- Steppe Wind Waves on Dunes -->
  <path d="M20,340 Q180,310 350,335 Q480,350 580,330" stroke="#E5BA7D" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M80,370 Q240,345 420,365" stroke="#E5BA7D" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Historical Badge -->
  <rect x="25" y="25" width="210" height="34" rx="4" fill="#2E4035" opacity="0.9" stroke="#C5A059" stroke-width="1.5"/>
  <text x="130" y="47" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#FFEBB3" text-anchor="middle">СТРАТЕГИЯЛЫҚ ШОҒЫРЛАНУ</text>
</svg>